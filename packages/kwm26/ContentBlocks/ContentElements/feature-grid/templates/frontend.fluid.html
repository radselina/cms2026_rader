<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">


<f:layout name="Default" />
<f:section name="Main">
    <section class="content-block-feature-grid">
        <div class="container">
            <f:if condition="{data.header}">
                <header class="feature-grid-header">
                    <h2>{data.header}</h2>
                    <f:if condition="{data.intro}">
                        <p>{data.intro}</p>
                    </f:if>
                </header>
            </f:if>


            <div class="row g-4">
                <f:for each="{data._grids.cards}" as="item">
                    <div class="col-12 col-md-6 col-lg-4">
                        <f:format.raw>
                            {item.content}
                        </f:format.raw>
                    </div>
                </f:for>
            </div>
        </div>
    </section>
</f:section>


</html>
